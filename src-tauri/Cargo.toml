[package]
name = "score-explorer"
version = "0.7.0"
description = "Local osu! score explorer"
edition = "2024"
default-run = "score-explorer"

[lib]
name = "score_explorer"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
md5 = "0.8"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "form", "query"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rosu-pp = "=4.0.1"
lazer-pp = { package = "rosu-pp-gemini", git = "https://github.com/Raregendary/rosu-pp-gemini", rev = "ba1741510d798c35f86b8aec6e026d5cb5399571" }
osu-downloader = { git = "https://github.com/DesireThings/osu-shelf-legacy", rev = "17ee63688d6b29bc8dede70be92aac44534fdc18", default-features = false, features = ["test-helpers"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
futures-util = "0.3"
rosu-mods = { version = "0.4.1", features = ["serde"] }
osu-db = { git = "https://github.com/kovaxis/osu-db", rev = "4cc3b836e1ee0e29eeadc7acad6e38824dd67243", default-features = false }

[[bin]]
name = "score-explorer"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "inspect-library"
path = "src/inspect.rs"
