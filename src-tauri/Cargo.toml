[package]
name = "score-explorer"
version = "0.3.0"
description = "Local osu! score explorer"
edition = "2024"
default-run = "score-explorer"

[lib]
name = "score_explorer"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
md5 = "0.8"
base64 = "0.22"
rosu-pp = "=4.0.1"
rosu-mods = { version = "0.4.1", features = ["serde"] }
osu-db = { git = "https://github.com/kovaxis/osu-db", rev = "4cc3b836e1ee0e29eeadc7acad6e38824dd67243", default-features = false }

[[bin]]
name = "score-explorer"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "inspect-library"
path = "src/inspect.rs"
